<style>
/* Düzen: tek sütun, üstte kurum şeridi + sekmeler; kartlar sade, durum renkleri yalnızca anlam taşırken */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --line:#dde3ea; --fg:#14202e; --muted:#5d6b7b;
  --brand:#16325c; --brand-ink:#ffffff; --accent:#1f6feb;

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141b; --panel:#171e27; --line:#2a3542; --fg:#e7edf4; --muted:#93a1b1;
  --brand:#16325c; --brand-ink:#ffffff; --accent:#5b9dff;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans)}

.hrow{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding-bottom:10px}
.logo{font-weight:700;letter-spacing:.06em;font-size:14px}

.who{margin-left:auto;text-align:right;font-size:13px}
.who button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer;margin-left:8px}

.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.note{border-radius:9px;padding:10px 12px;font-size:14px}
.note.err{background:var(--bad-bg);color:var(--bad)} .note.ok{background:var(--ok-bg);color:var(--ok)} .note.info{background:var(--warn-bg);color:var(--warn)}

.cal.pickable{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}

.stats .hl{background:var(--ok-bg)}.stats .hl b{color:var(--ok)}
label.check{flex-direction:row;align-items:flex-start;gap:10px;color:var(--fg);font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}

label.check span{display:flex;flex-direction:column;gap:2px}label.check small{color:var(--muted);font-size:12.5px}
.tag.mk{background:#fdecd8;color:#9a4a00}
label.check.off{opacity:.55}
div.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
div.check span{display:flex;flex-direction:column;gap:2px}div.check small{color:var(--muted);font-size:12.5px}
div.check input[type=checkbox]{width:18px!important;height:18px}
.tag.gec{background:#e8eafd;color:#2f3a9e}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--accent);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.stats .neg{background:#fde8e6}.stats .neg b{color:var(--bad)}
.ledger{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start}
.lrow:last-child{border-bottom:0}
.lrow .ld{font:500 12px var(--mono);color:var(--muted);min-width:84px;padding-top:2px}
.lrow .lt{min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.lrow .la{text-align:right;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.lrow .la small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.lrow.in .la b{color:var(--ok)}.lrow.out .la b{color:var(--bad)}
@media (max-width:420px){.lrow{grid-template-columns:1fr auto}.lrow .ld{grid-column:1 / -1;min-width:0}}
.switch-role{display:flex;justify-content:center;margin-top:18px}

.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tiles4 div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}

.gm-lbl{transform:translate(0,-22px);background:#fff;padding:1px 6px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}

.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
main.wide{max-width:1240px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.kpi span{font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.88}
.kpi b{font:800 30px/1.15 var(--sans);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:13px;font-weight:600;opacity:.92}
.k-blue{background:#2563eb}.k-purple{background:#7c3aed}.k-teal{background:#0e7490}.k-red{background:#dc2626}.k-green{background:#15803d}.k-orange{background:#c2410c}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tcard,.pcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,.07);display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0;min-width:0}
.tcard{cursor:pointer}.tcard:hover,.pcard:hover{border-color:var(--accent)}
.pcard{padding:14px;gap:12px}.pcard.off{opacity:.6}
.tthumb{position:relative;height:110px}.tthumb svg{display:block;width:100%;height:100%}
.tbadge{position:absolute;top:10px;left:10px;background:#2563eb;color:#fff;font-size:12px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:99px}
.tdate{position:absolute;top:10px;right:10px;background:rgba(15,23,42,.8);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px}
.tbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.ttitle{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsub{font-size:13px;color:var(--muted);font-weight:600}
.tstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tstats div{border-radius:10px;padding:8px 4px;text-align:center}
.tstats b{display:block;font:800 19px var(--sans);font-variant-numeric:tabular-nums}.tstats span{font-size:11px;font-weight:700}
.s1{background:#eff6ff;color:#1d4ed8}.s2{background:#f5f3ff;color:#6d28d9}.s3{background:#ecfeff;color:#0e7490}

.avatar{flex:none;width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px}

.abicon{font-size:22px}

.mband.ok{background:#dcfce7;color:#166534}.mband.orange{background:#ffedd5;color:#9a3412}.mband.red{background:#dc2626;color:#fff}.mband.none{background:var(--bg);color:var(--muted)}

dialog.dlg{width:min(860px,94vw);max-height:90vh;border:0;border-radius:18px;padding:18px;background:var(--panel);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const ADMIN = location.hash === "#yonetici";
function goRole(admin){ history.replaceState(null, "", location.pathname + location.search + (admin ? "#yonetici" : "")); location.reload(); }
const LS = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} } };
const IL = ["Adana","Adıyaman","Afyonkarahisar","Ağrı","Aksaray","Amasya","Ankara","Antalya","Ardahan","Artvin","Aydın","Balıkesir","Bartın","Batman","Bayburt","Bilecik","Bingöl","Bitlis","Bolu","Burdur","Bursa","Çanakkale","Çankırı","Çorum","Denizli","Diyarbakır","Düzce","Edirne","Elazığ","Erzincan","Erzurum","Eskişehir","Gaziantep","Giresun","Gümüşhane","Hakkari","Hatay","Iğdır","Isparta","İstanbul","İzmir","Kahramanmaraş","Karabük","Karaman","Kars","Kastamonu","Kayseri","Kırıkkale","Kırklareli","Kırşehir","Kilis","Kocaeli","Konya","Kütahya","Malatya","Manisa","Mardin","Mersin","Muğla","Muş","Nevşehir","Niğde","Ordu","Osmaniye","Rize","Sakarya","Samsun","Siirt","Sinop","Sivas","Şanlıurfa","Şırnak","Tekirdağ","Tokat","Trabzon","Tunceli","Uşak","Van","Yalova","Yozgat","Zonguldak"];
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

/* ---------- yardımcılar ---------- */
function h(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const tr = s => { const d = parse(s); return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear(); };
const trShort = s => { const d = parse(s); return pad(d.getDate()) + "." + pad(d.getMonth() + 1); };
const days = (a, b) => Math.round((parse(b) - parse(a)) / 864e5) + 1;
function sundays(a, b){ let n = 0; for (let d = parse(a); d <= parse(b); d.setDate(d.getDate() + 1)) if (d.getDay() === 0) n++; return n; }
const TL = n => Number(n || 0).toLocaleString("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 2 });
const note = (txt, kind = "err") => h("div", { class: "note " + kind, role: kind === "err" ? "alert" : "status" }, txt);

async function rpc(fn, args = {}){
  const headers = { "Content-Type": "application/json", apikey: window.SB_KEY };
  if (String(window.SB_KEY).startsWith("eyJ")) headers.Authorization = "Bearer " + window.SB_KEY;
  let r;
  try { r = await fetch(window.SB_URL.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, { method: "POST", headers, body: JSON.stringify(args) }); }
  catch (e) { throw new Error("Sunucuya ulaşılamadı. İnternet bağlantını kontrol et."); }
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok){
    const m = (j && (j.message || j.hint)) || ("Hata " + r.status);
    if (/Oturum süresi doldu/.test(m)) { logout(true); }
    throw new Error(m);
  }
  if (j && typeof j === "object" && !Array.isArray(j) && j.hata) throw new Error(j.hata);
  return j;
}

/* ---------- takvim ---------- */
const PALET = ["#e8710a","#1a73e8","#188038","#a142f4","#d93025","#007b83","#b06000","#c5221f","#3949ab","#00897b","#8e24aa","#5f6368"];
// Her firmaya sırayla farklı renk verilir (çakışma olmasın); palet bitince hash'e düşer.
const RENKLER = new Map();
function firmaKey(name){ return (name || "").trim().toLocaleLowerCase("tr"); }
function firmalariKaydet(list){
  [...list].sort((p, q) => (p.baslangic < q.baslangic ? -1 : p.baslangic > q.baslangic ? 1 : 0)).forEach(it => firmaRenk(it.firma));
}
function firmaRenk(name){
  const k = firmaKey(name);
  if (RENKLER.has(k)) return RENKLER.get(k);
  const taken = new Set(RENKLER.values());
  let c = PALET.find(p => !taken.has(p));
  if (!c){ let x = 0; for (const ch of k || "?") x = (x * 31 + ch.codePointAt(0)) >>> 0; c = PALET[x % PALET.length]; }
  RENKLER.set(k, c);
  return c;
}
const DOW = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
function mondayOf(d){ const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; }

/**
 * Aylık takvim. items: {id, baslangic, bitis, firma, ...}; label(it) şerit yazısı; marks: {"YYYY-MM-DD": "İzin"}.
 * onPick(it) şeride dokununca; onMonth(y, m) ay değişince; onRange(bas, bit) günler seçilince
 * (fareyle sürükle; dokunmatikte basılı tut + sürükle; boş güne tek dokunuş = tek gün).
 */
function calendar({ items, label, marks = {}, onPick, onMonth, start, pendingOf, onRange }){
  let cur = start ? new Date(start.getFullYear(), start.getMonth(), 1) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  let selected = null;
  const root = h("div", { class: "cal" });
  firmalariKaydet(items || []);
  function render(){
    root.textContent = "";
    const y = cur.getFullYear(), m = cur.getMonth();
    root.append(h("div", { class: "cal-head" },
      h("button", { type: "button", "aria-label": "Önceki ay", onclick: () => go(-1) }, "‹"),
      h("strong", {}, AYLAR[m] + " " + y),
      h("button", { type: "button", class: "today", onclick: () => { const n = new Date(); cur = new Date(n.getFullYear(), n.getMonth(), 1); changed(); } }, "Bugün"),
      h("button", { type: "button", "aria-label": "Sonraki ay", onclick: () => go(1) }, "›")));
    root.append(h("div", { class: "cal-dow" }, DOW.map(d => h("span", {}, d))));
    const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
    const todayIso = today();
    const used = new Set();
    for (let ws = mondayOf(first); ws <= last; ws.setDate(ws.getDate() + 7)){
      const wsIso = iso(ws), we = new Date(ws); we.setDate(we.getDate() + 6); const weIso = iso(we);
      const week = h("div", { class: "cal-week", "data-ws": wsIso });
      const bg = h("div", { class: "cal-bg" });
      for (let i = 0; i < 7; i++){
        const d = new Date(ws); d.setDate(d.getDate() + i);
        const out = d.getMonth() !== m, di = iso(d);
        bg.append(h("div", { class: out ? "out" : "", "data-d": di }));
        week.append(h("div", { class: "cal-num" + (out ? " out" : "") + (di === todayIso ? " now" : ""), style: "grid-column:" + (i + 1) + ";grid-row:1" },
          h("span", {}, d.getDate()), marks[di] ? h("span", { class: "lv" }, marks[di]) : null));
      }
      week.prepend(bg);
      // bu haftaya düşen kayıt parçaları, şeritlere yerleştir
      const segs = items.filter(it => it.baslangic <= weIso && it.bitis >= wsIso)
        .map(it => {
          const a = it.baslangic < wsIso ? wsIso : it.baslangic, b = it.bitis > weIso ? weIso : it.bitis;
          return { it, a: days(wsIso, a) - 1, b: days(wsIso, b) - 1, cl: it.baslangic < wsIso, cr: it.bitis > weIso };
        })
        .sort((p, q) => p.a - q.a || (q.b - q.a) - (p.b - p.a));
      const lanes = [];
      for (const sg of segs){
        let li = lanes.findIndex(end => end < sg.a);
        if (li < 0){ li = lanes.length; lanes.push(-1); }
        lanes[li] = sg.b;
        const col = firmaRenk(sg.it.firma);
        used.add(sg.it.firma || "—");
        const bar = h("button", {
          type: "button",
          class: "cal-bar" + (sg.cl ? " cont-l" : "") + (sg.cr ? " cont-r" : "") + (selected === sg.it.id ? " sel" : "") + (pendingOf && pendingOf(sg.it) ? " wait" : ""),
          style: "grid-column:" + (sg.a + 1) + " / span " + (sg.b - sg.a + 1) + ";grid-row:" + (li + 2) + ";background-color:" + col,
          title: (label(sg.it)) + " · " + tr(sg.it.baslangic) + (sg.it.bitis !== sg.it.baslangic ? "–" + tr(sg.it.bitis) : ""),
          onclick: () => { if (root._skip) return; selected = sg.it.id; render(); onPick && onPick(sg.it); }
        }, label(sg.it));
        week.append(bar);
      }
      root.append(week);
    }
    if (used.size){
      root.append(h("div", { class: "cal-legend" }, [...used].map(f => h("span", {}, h("i", { style: "background:" + firmaRenk(f === "—" ? "" : f) }), f))));
    }
  }
  function go(n){ cur = new Date(cur.getFullYear(), cur.getMonth() + n, 1); changed(); }
  function changed(){ render(); onMonth && onMonth(cur.getFullYear(), cur.getMonth()); }
  root.setItems = (list, mk) => { items = list; firmalariKaydet(list); if (mk) marks = mk; render(); };
  root.month = () => [cur.getFullYear(), cur.getMonth()];
  render();
  if (onRange) rangePicker(root, onRange);
  return root;
}

// Takvimde gün aralığı seçme: fare ile sürükle, dokunmatikte basılı tutup sürükle.
function rangePicker(root, onRange){
  root.classList.add("pickable");
  let a = null, b = null, mode = null, timer = null, sx = 0, sy = 0, onBar = false, moved = false;
  const dayAt = (x, y) => {
    const el = document.elementFromPoint(x, y), wk = el && el.closest(".cal-week");
    if (!wk || !root.contains(wk)) return null;
    const r = wk.getBoundingClientRect(), i = Math.min(6, Math.max(0, Math.floor((x - r.left) / (r.width / 7))));
    const d = parse(wk.dataset.ws); d.setDate(d.getDate() + i); return iso(d);
  };
  const paint = () => {
    const p = a && b ? (a <= b ? a : b) : null, q = a && b ? (a <= b ? b : a) : null;
    root.querySelectorAll(".cal-bg div[data-d]").forEach(c => c.classList.toggle("pick", !!p && c.dataset.d >= p && c.dataset.d <= q));
  };
  const reset = () => { clearTimeout(timer); mode = null; a = b = null; paint(); };
  const skipClick = () => { root._skip = true; setTimeout(() => { root._skip = false; }, 80); };
  const finish = () => { const p = a <= b ? a : b, q = a <= b ? b : a; reset(); onRange(p, q); };
  // fare
  const mm = e => { const d = dayAt(e.clientX, e.clientY); if (d && d !== b){ b = d; moved = true; paint(); } };
  const mu = () => {
    window.removeEventListener("mousemove", mm); window.removeEventListener("mouseup", mu);
    if (mode !== "sel") return;
    if (onBar && !moved){ reset(); return; }      // şeride normal tıklama: detayı göster
    if (onBar) skipClick();
    finish();
  };
  root.addEventListener("mousedown", e => {
    if (e.button !== 0 || e.target.closest(".cal-head,.cal-dow,.cal-legend")) return;
    const d = dayAt(e.clientX, e.clientY); if (!d) return;
    a = b = d; mode = "sel"; moved = false; onBar = !!e.target.closest(".cal-bar");
    if (!onBar){ paint(); e.preventDefault(); }
    window.addEventListener("mousemove", mm); window.addEventListener("mouseup", mu);
  });
  // dokunmatik
  root.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || e.target.closest(".cal-head,.cal-dow,.cal-legend")) return;
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    const d = dayAt(sx, sy); if (!d) return;
    a = b = d; mode = "wait"; onBar = !!e.target.closest(".cal-bar");
    timer = setTimeout(() => { mode = "sel"; paint(); if (navigator.vibrate) navigator.vibrate(15); }, 300);
  }, { passive: true });
  root.addEventListener("touchmove", e => {
    if (!mode) return;
    const t = e.touches[0];
    if (mode === "wait"){ if (Math.hypot(t.clientX - sx, t.clientY - sy) > 8) reset(); return; }  // kaydırıyor
    e.preventDefault();
    const d = dayAt(t.clientX, t.clientY); if (d && d !== b){ b = d; paint(); }
  }, { passive: false });
  root.addEventListener("touchend", e => {
    if (!mode) return;
    clearTimeout(timer);
    if (mode === "wait"){                            // kısa dokunuş
      if (onBar){ mode = null; a = b = null; return; } // şerit kendi tıklamasını alır
      e.preventDefault(); const d = a; reset(); onRange(d, d); return;
    }
    e.preventDefault(); skipClick(); finish();
  });
  root.addEventListener("touchcancel", reset);
  root.addEventListener("contextmenu", e => { if (mode) e.preventDefault(); });
}

/* ---------- Harita katmanı: Google (config.js'te GMAPS_KEY varsa) ya da OpenStreetMap (Leaflet) ---------- */
function loadScript(src){ return new Promise((ok, bad) => { const js = document.createElement("script"); js.src = src; js.onload = ok; js.onerror = () => bad(new Error("Harita yüklenemedi")); document.head.append(js); }); }
let mapLib = null;
// Google anahtarı bu tarayıcıda reddedilirse (ör. Firefox adres bilgisini göndermiyor) bir gün OpenStreetMap kullan.
window.gm_authFailure = function(){
  try { localStorage.setItem("gm_fail", String(Date.now())); } catch (e) {}
  if (!sessionStorage.getItem("gm_reloaded")){ try { sessionStorage.setItem("gm_reloaded", "1"); } catch (e) {} location.reload(); }
};
function gmBlocked(){
  try { return Date.now() - Number(localStorage.getItem("gm_fail") || 0) < 24 * 3600 * 1000; } catch (e) { return false; }
}
async function mapReady(){
  if (mapLib) return mapLib;
  if (window.GMAPS_KEY && !gmBlocked()){
    try {
      await new Promise((ok, bad) => {
        window.__gmReady = ok;
        loadScript("https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(window.GMAPS_KEY) + "&v=weekly&language=tr&region=TR&libraries=geometry&callback=__gmReady").catch(bad);
        setTimeout(() => bad(new Error("Google haritası yüklenemedi")), 12000);
      });
      return (mapLib = "google");
    } catch (e) { /* Leaflet'e düş */ }
  }
  if (!window.L){
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.append(css);
    await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js");
  }
  return (mapLib = "leaflet");
}
function decodePath(str){
  const out = []; let i = 0, lat = 0, lng = 0;
  while (i < str.length){
    for (const k of [0, 1]){
      let res = 0, shift = 0, b;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = (res & 1) ? ~(res >> 1) : (res >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
/** Tek arayüz: dot (renkli nokta + etiket + açılır bilgi), line, fit, center */
async function makeMap(el, center = [38.0, 32.5], zoom = 6){
  const lib = await mapReady();
  if (lib === "google"){
    const g = google.maps;
    const map = new g.Map(el, { center: { lat: center[0], lng: center[1] }, zoom, mapTypeControl: false, streetViewControl: false, fullscreenControl: true, clickableIcons: false });
    const info = new g.InfoWindow();
    return {
      lib,
      dot(id, lat, lng, color, label, html){
        this._m = this._m || {};
        let m = this._m[id];
        const icon = { path: g.SymbolPath.CIRCLE, scale: 10, fillColor: color, fillOpacity: 1, strokeColor: "#fff", strokeWeight: 3 };
        if (!m){
          m = new g.Marker({ map, position: { lat, lng }, icon, label: label ? { text: label, color: "#16325c", fontWeight: "700", fontSize: "12px", className: "gm-lbl" } : null, zIndex: 10 });
          m.addListener("click", () => { info.setContent(m.__html); info.open({ map, anchor: m }); });
          this._m[id] = m;
        }
        m.setPosition({ lat, lng }); m.setIcon(icon); m.__html = html;
        return { open(){ info.setContent(m.__html); info.open({ map, anchor: m }); } };
      },
      line(pts, color = "#1a73e8", weight = 5){ return new g.Polyline({ map, path: pts.map(p => ({ lat: p[0], lng: p[1] })), strokeColor: color, strokeWeight: weight, strokeOpacity: .9 }); },
      fit(pts){ if (!pts.length) return; if (pts.length === 1){ map.setCenter({ lat: pts[0][0], lng: pts[0][1] }); map.setZoom(12); return; } const b = new g.LatLngBounds(); pts.forEach(p => b.extend({ lat: p[0], lng: p[1] })); map.fitBounds(b, 40); },
      center(lat, lng, z = 14){ map.setCenter({ lat, lng }); map.setZoom(z); }
    };
  }
  const map = L.map(el).setView(center, zoom);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  return {
    lib,
    dot(id, lat, lng, color, label, html){
      this._m = this._m || {};
      let m = this._m[id];
      if (!m){ m = L.circleMarker([lat, lng], { radius: 11, weight: 3, color: "#fff", fillColor: color, fillOpacity: 1 }).addTo(map); if (label) m.bindTooltip(label, { permanent: true, direction: "right", offset: [10, 0] }); this._m[id] = m; }
      m.setLatLng([lat, lng]).setStyle({ fillColor: color }).bindPopup(html);
      return { open(){ m.openPopup(); } };
    },
    line(pts, color = "#1a73e8", weight = 5){ return L.polyline(pts, { color, weight, opacity: .9 }).addTo(map); },
    fit(pts){ if (!pts.length) return; pts.length === 1 ? map.setView(pts[0], 12) : map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 }); },
    center(lat, lng, z = 14){ map.setView([lat, lng], z); }
  };
}

/* ---------- Araçlar: Koridor Ortalama uygulamasından gelen son konumlar ---------- */
function agoText(t){
  const m = Math.round((Date.now() - new Date(t).getTime()) / 60000);
  if (m < 1) return "şimdi"; if (m < 60) return m + " dk önce";
  const h = Math.floor(m / 60); if (h < 24) return h + " sa önce";
  return new Date(t).toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" });
}
function vehState(v){
  if (!v.zaman) return { k: "yok", t: "Konum yok", c: "#9aa3a8" };
  const age = (Date.now() - new Date(v.zaman).getTime()) / 60000;
  if (v.durum === "kapali") return { k: "kapali", t: "Son iş konumu · " + agoText(v.zaman), c: "#8a8f93" };
  if (age > 15) return { k: "eski", t: "Son konum · " + agoText(v.zaman), c: "#8a8f93" };
  if (v.durum === "surus" && (v.hiz || 0) >= 5) return { k: "yolda", t: "Yolda · " + (v.hiz || 0) + " km/s", c: "#188038" };
  if (v.durum === "surus") return { k: "durdu", t: "Sürüşte, duruyor", c: "#e8710a" };
  return { k: "hazir", t: "Uygulama açık, sürüş yok", c: "#1a73e8" };
}

/* =====================================================================

function initials(ad){ return (ad || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toLocaleUpperCase("tr")).join(""); }
function personColor(ad){ let x = 0; for (const ch of ad || "?") x = (x * 31 + ch.codePointAt(0)) >>> 0; return ["#2563eb", "#7c3aed", "#0e7490", "#ea580c", "#16a34a", "#db2777", "#4f46e5", "#b45309"][x % 8]; }
function muayeneText(g){ if (g == null) return "Muayene tarihi girilmedi"; if (g < 0) return "Muayene " + (-g) + " gün geçti!"; if (g === 0) return "Muayene bugün!"; return "Muayeneye " + g + " gün"; }
function muayeneKind(g){ return g == null ? "none" : g <= 7 ? "red" : g <= 30 ? "orange" : "ok"; }

/** Kartın üstündeki küçük rota çizimi (uygulamadan gelen iz). */
function thumb(iz, seed){
  const W = 320, H = 110, P = 16;
  let body = "";
  if (iz){
    let pts = decodePath(iz);
    const step = Math.max(1, Math.floor(pts.length / 250)); pts = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
    if (pts.length > 1){
      const la = pts.map(p => p[0]), lo = pts.map(p => p[1]);
      const k = Math.cos((Math.min(...la) + Math.max(...la)) / 2 * Math.PI / 180);
      const w = Math.max((Math.max(...lo) - Math.min(...lo)) * k, 1e-6), hh = Math.max(Math.max(...la) - Math.min(...la), 1e-6);
      const sc = Math.min((W - 2 * P) / w, (H - 2 * P) / hh), ox = (W - w * sc) / 2, oy = (H - hh * sc) / 2;
      const minLo = Math.min(...lo), maxLa = Math.max(...la);
      const XY = p => [(ox + (p[1] - minLo) * k * sc).toFixed(1), (oy + (maxLa - p[0]) * sc).toFixed(1)];
      const d = pts.map((p, i) => (i ? "L" : "M") + XY(p).join(" ")).join("");
      const a = XY(pts[0]), b = XY(pts[pts.length - 1]);
      body = `<path d="${d}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>` +
        `<path d="${d}" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>` +
        `<circle cx="${a[0]}" cy="${a[1]}" r="7" fill="#16a34a" stroke="#fff" stroke-width="3"/><circle cx="${b[0]}" cy="${b[1]}" r="7" fill="#0f172a" stroke="#fff" stroke-width="3"/>`;
    }
  }
  if (!body) body = `<text x="${W / 2}" y="${H / 2 + 5}" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Rota çizgisi yok</text>`;
  const div = h("div", { class: "tthumb", style: "background-color:" + TINTS[seed % TINTS.length] });
  div.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${body}</svg>`;
  return div;
}

function tripCard(r, onOpen){
  const card = h("button", { type: "button", class: "tcard", onclick: () => onOpen(r) });
  const th = thumb(r.iz, r.id);
  th.append(h("span", { class: "tbadge" }, "İŞ"), h("span", { class: "tdate" }, dayOf(r.baslangic) + " · " + hmOf(r.baslangic)));
  const title = r.yer ? "📍 " + r.yer : (r.hedef || "Serbest sürüş");
  card.append(th, h("div", { class: "tbody" },
    h("div", { class: "ttitle" }, title),
    h("div", { class: "tsub" }, [r.calisan, r.plaka, hmOf(r.baslangic) + "–" + hmOf(r.bitis)].filter(Boolean).join(" · ")),
    h("div", { class: "tstats" },
      h("div", { class: "s1" }, h("b", {}, fmtKm(r.km)), h("span", {}, "KM")),
      h("div", { class: "s2" }, h("b", {}, fmtDk(r.sure_dk)), h("span", {}, "SÜRE")),
      h("div", { class: "s3" }, h("b", {}, r.ortalama != null ? r.ortalama : "—"), h("span", {}, "ORT km/s"))),
    h("div", { class: "pills" },
      h("span", { class: "pill p-eds" }, r.koridor ? r.koridor + " EDS geçti" : "EDS yok"),
      r.asim ? h("span", { class: "pill p-bad" }, r.asim + " ihlal") : (r.koridor ? h("span", { class: "pill p-ok" }, "İhlal yok") : null))));
  return card;
}

/** Yolculuk ayrıntısı: açılır pencerede rota haritası ve koridor tablosu. */
async function tripDialog(r){
  const dlg = h("dialog", { class: "dlg" });
  const body = h("div", { style: "display:flex;flex-direction:column;gap:10px" });
  dlg.append(h("div", { class: "split" }, h("h2", { style: "margin:0" }, (r.yer || r.hedef || "Yolculuk")),
    h("button", { class: "btn", type: "button", onclick: () => dlg.close() }, "Kapat")),
    h("p", { class: "muted small", style: "margin:0" }, [r.calisan, r.plaka, new Date(r.baslangic).toLocaleString("tr-TR", { dateStyle: "full", timeStyle: "short" })].filter(Boolean).join(" · ")), body);
  dlg.addEventListener("close", () => dlg.remove());
  document.body.append(dlg); dlg.showModal();
  body.append(h("p", { class: "muted" }, "Yükleniyor…"));
  try {
    const d = await rpc("y_yolculuk_detay", { p_token: A.token, p_id: r.id });
    body.textContent = "";
    body.append(h("div", { class: "kpis" },
      h("div", { class: "kpi k-blue" }, h("span", {}, "MESAFE"), h("b", {}, fmtKm(d.km) + " km")),
      h("div", { class: "kpi k-purple" }, h("span", {}, "SÜRE"), h("b", {}, fmtDk(d.sure_dk))),
      h("div", { class: "kpi k-teal" }, h("span", {}, "ORTALAMA"), h("b", {}, (d.ortalama ?? "—") + " km/s")),
      h("div", { class: "kpi " + (d.asim ? "k-red" : "k-green") }, h("span", {}, "EDS İHLALİ"), h("b", {}, d.asim || 0))));
    if (d.iz){
      const el = h("div", { style: "height:340px;border-radius:12px;border:1px solid var(--line);overflow:hidden" });
      body.append(el);
      const pts = decodePath(d.iz);
      try {
        const m = await makeMap(el, pts[0], 10);
        m.line(pts, "#2563eb", 5);
        m.dot("s", pts[0][0], pts[0][1], "#16a34a", "Başlangıç", "Başlangıç · " + hmOf(d.baslangic));
        const e = pts[pts.length - 1];
        m.dot("e", e[0], e[1], "#0f172a", r.yer || d.hedef || "Bitiş", "Bitiş · " + hmOf(d.bitis) + (d.hedef ? "<br>" + esc(d.hedef) : ""));
        m.fit(pts);
      } catch (err) { el.replaceWith(note(err.message)); }
    }
    const ks = d.koridorlar || [];
    if (ks.length){
      const list = h("div", { style: "display:flex;flex-direction:column;gap:6px" });
      ks.forEach(k => {
        const over = k.limit != null && k.ort > k.limit;
        list.append(h("div", { class: "krow" + (over ? " over" : "") },
          h("div", {}, h("strong", {}, k.ad), h("div", { class: "muted small" }, [k.km != null ? fmtKm(k.km) + " km" : null, fmtDk((k.sure || 0) / 60) + " sürdü", k.bekleme ? "bekleme " + fmtDk(k.bekleme / 60) : null, "limit " + (k.limit ?? "?")].filter(Boolean).join(" · "))),
          h("b", {}, k.ort)));
      });
      body.append(h("h3", { style: "margin:6px 0 0" }, "Geçilen EDS koridorları"), list);
    } else body.append(h("p", { class: "muted small" }, "Bu yolculukta EDS koridoru geçilmedi."));
  } catch (e) { body.replaceChildren(note(e.message)); }
}

function csvDownload(rows){
  const q = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const num = n => n == null ? "" : String(n).replace(".", ",");
  const lines = [["Tarih", "Başlangıç", "Bitiş", "Çalışan", "Plaka", "Araç", "Hedef", "Varılan yer", "Km", "Süre (dk)", "Ortalama km/s", "Hareket ort. km/s", "EDS", "İhlal"].join(";")];
  rows.forEach(r => lines.push([new Date(r.baslangic).toLocaleDateString("tr-TR"), hmOf(r.baslangic), hmOf(r.bitis), r.calisan, r.plaka, r.arac, r.hedef, r.yer,
    num(r.km), r.sure_dk, r.ortalama ?? "", r.hareket_ort ?? "", r.koridor, r.asim].map(q).join(";")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = h("a", { href: URL.createObjectURL(blob), download: "yolculuklar-" + today() + ".csv" });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

async function adminTrips(){
  A.tf = A.tf || { view: "liste", range: "ay", min50: false, ihlal: false, who: "", plate: "" };
  const F = A.tf;
  const [a0, b0] = monthRange(0);

  const plate = h("select", {}, h("option", { value: "" }, "Bütün araçlar"));
  const kpis = h("div", { class: "kpis" }), out = h("div", { style: "display:flex;flex-direction:column;gap:12px" });

  const xls = h("button", { class: "btn ok", type: "button", onclick: () => csvDownload(shown) }, "⬇ Excel indir");
  const seg = h("div", { class: "seg" }, [["liste", "Yolculuklar"], ["karne", "Sürücü karnesi"], ["musteri", "Müşteriler"]].map(([k, t]) =>
    h("button", { type: "button", "aria-pressed": String(F.view === k), onclick: ev => { F.view = k; [...seg.children].forEach(b => b.setAttribute("aria-pressed", String(b === ev.currentTarget))); render(); } }, t)));
  const chip = (label, on, fn) => h("button", { type: "button", class: "chip", "aria-pressed": String(on), onclick: fn }, label);
  const chips = h("div", { class: "chips" });
  function drawChips(){
    chips.replaceChildren(
      chip("Bu ay", F.range === "ay", () => { F.range = "ay"; [bas.value, bit.value] = monthRange(0); fetchRows(); }),
      chip("Geçen ay", F.range === "gecen", () => { F.range = "gecen"; [bas.value, bit.value] = monthRange(-1); fetchRows(); }),
      chip("Tümü", F.range === "tum", () => { F.range = "tum"; bas.value = ""; bit.value = ""; fetchRows(); }),
      chip("50 km üstü", F.min50, () => { F.min50 = !F.min50; render(); }),
      chip("İhlalli", F.ihlal, () => { F.ihlal = !F.ihlal; render(); }));
  }
  app.append(h("div", { class: "split" }, h("h2", {}, "Yolculuklar"), h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, seg, xls)),
    h("p", { class: "muted small", style: "margin:0" }, "Koridor Ortalama uygulamasında şirket aracıyla “İş” olarak yapılan yolculuklar. Şahsi yolculuklar firmaya hiç gelmez."),
    kpis,
    h("div", { class: "card" }, chips, h("div", { class: "row" }, h("label", {}, "Başlangıç", bas), h("label", {}, "Bitiş", bit), h("label", {}, "Sürücü", who), h("label", {}, "Araç", plate))),
    out);
  function filtered(){
    return rows.filter(r => (!F.who || r.calisan === F.who) && (!F.plate || (r.plaka || "") === F.plate) && (!F.min50 || Number(r.km) >= 50) && (!F.ihlal || r.asim > 0));
  }
  function render(){
    drawChips();
    shown = filtered();
    const km = shown.reduce((s, r) => s + Number(r.km), 0), dk = shown.reduce((s, r) => s + r.sure_dk, 0);
    const ih = shown.reduce((s, r) => s + (r.asim || 0), 0), ko = shown.reduce((s, r) => s + (r.koridor || 0), 0);
    const drivers = new Set(shown.map(r => r.calisan)).size, cars = new Set(shown.map(r => r.plaka).filter(Boolean)).size;
    kpis.replaceChildren(
      h("div", { class: "kpi k-blue" }, h("span", {}, "TOPLAM KM"), h("b", {}, fmtKm(km)), h("small", {}, shown.length + " yolculuk")),
      h("div", { class: "kpi k-purple" }, h("span", {}, "SÜRÜCÜ · ARAÇ"), h("b", {}, drivers + " · " + cars), h("small", {}, "bu listede")),
      h("div", { class: "kpi k-teal" }, h("span", {}, "ORTALAMA HIZ"), h("b", {}, dk ? Math.round(km / (dk / 60)) + " km/s" : "—"), h("small", {}, "toplam süre " + fmtDk(dk))),
      h("div", { class: "kpi " + (ih ? "k-red" : "k-green") }, h("span", {}, "EDS İHLALİ"), h("b", {}, ih), h("small", {}, ko + " koridordan")));

    if (F.view === "liste"){
      let day = "", grid = null;
      for (const r of shown){
        const dkey = new Date(r.baslangic).toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
        if (dkey !== day){ day = dkey; out.append(h("div", { class: "month" }, dkey)); grid = h("div", { class: "tgrid" }); out.append(grid); }
        grid.append(tripCard(r, tripDialog));
      }
    } else if (F.view === "karne"){
      const by = {};
      shown.forEach(r => { const v = by[r.calisan] = by[r.calisan] || { n: 0, km: 0, dk: 0, ih: 0, ko: 0, pl: new Set(), ust50: 0 };
        v.n++; v.km += Number(r.km); v.dk += r.sure_dk; v.ih += r.asim || 0; v.ko += r.koridor || 0; r.plaka && v.pl.add(r.plaka); if (Number(r.km) >= 50) v.ust50++; });

            h("div", {}, h("div", { class: "ttitle" }, ad), h("div", { class: "tsub" }, [...v.pl].join(", ") || "—"))),
          h("div", { class: "tstats" },
            h("div", { class: "s1" }, h("b", {}, fmtKm(v.km)), h("span", {}, "KM")),
            h("div", { class: "s2" }, h("b", {}, v.n), h("span", {}, "YOLCULUK")),
            h("div", { class: "s3" }, h("b", {}, v.dk ? Math.round(v.km / (v.dk / 60)) : "—"), h("span", {}, "ORT km/s"))),
          h("div", { class: "pills" },
            h("span", { class: "pill p-eds" }, v.ko + " EDS"),
            h("span", { class: "pill " + (v.ih ? "p-bad" : "p-ok") }, v.ih ? v.ih + " ihlal" : "İhlal yok"),
            v.ust50 ? h("span", { class: "pill p-place" }, v.ust50 + " yolculuk 50 km üstü") : null),
          h("button", { class: "btn link", type: "button", onclick: () => { F.who = ad; who.value = ad; F.view = "liste"; [...seg.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === 0))); render(); } }, "Yolculuklarını gör ›")));
      });
      out.append(grid);
    } else {
      const by = {};
      shown.forEach(r => { if (!r.yer) return; const v = by[r.yer] = by[r.yer] || { n: 0, km: 0, son: r.baslangic, who: new Set() };
        v.n++; v.km += Number(r.km); if (r.baslangic > v.son) v.son = r.baslangic; v.who.add(r.calisan); });
      const list = Object.entries(by).sort((x, y) => y[1].n - x[1].n);
      if (!list.length){ out.append(h("div", { class: "card" }, h("p", { class: "muted", style: "margin:0" }, "Bu seçimde kayıtlı bir yere (müşteri/iş yeri) varılan yolculuk yok. Çalışanlar uygulamada yeri “Kaydet” ile isimlendirince, oraya varılan yolculuklar o isimle burada toplanır."))); return; }
      const grid = h("div", { class: "tgrid" });
      list.forEach(([yer, v]) => grid.append(h("div", { class: "pcard" },
        h("div", { style: "display:flex;align-items:center;gap:12px" }, h("span", { class: "avatar", style: "background:" + personColor(yer) }, "📍"),
          h("div", {}, h("div", { class: "ttitle" }, yer), h("div", { class: "tsub" }, "Son ziyaret " + new Date(v.son).toLocaleDateString("tr-TR", { day: "numeric", month: "long" })))),
        h("div", { class: "tstats" },
          h("div", { class: "s2" }, h("b", {}, v.n), h("span", {}, "ZİYARET")),
          h("div", { class: "s1" }, h("b", {}, fmtKm(v.km)), h("span", {}, "KM")),
          h("div", { class: "s3" }, h("b", {}, v.who.size), h("span", {}, "SÜRÜCÜ"))),
        h("div", { class: "tsub" }, [...v.who].join(", ")))));
      out.append(grid);
    }
  }
  async function fetchRows(){
    F.bas = bas.value; F.bit = bit.value;
    out.replaceChildren(h("p", { class: "muted" }, "Yükleniyor…"));
    try {
      rows = await rpc("y_yolculuklar", { p_token: A.token, p_bas: bas.value || null, p_bit: bit.value || null }) || [];
      const plates = [...new Set(rows.map(r => r.plaka).filter(Boolean))].sort();
      plate.replaceChildren(h("option", { value: "" }, "Bütün araçlar"), ...plates.map(p => h("option", { value: p, selected: F.plate === p }, p)));
      render();

  who.addEventListener("change", () => { F.who = who.value; render(); });

/** Muayenesi yaklaşan araçlar (her yönetici sekmesinin üstünde). */
function muayeneBar(cars){
  const due = (cars || []).filter(c => c.aktif && c.kalan_gun != null && c.kalan_gun <= 30).sort((a, b) => a.kalan_gun - b.kalan_gun);
  if (!due.length) return null;
  const red = due.some(c => c.kalan_gun <= 7);
  return h("div", { class: "alertbar" + (red ? " red" : "") },
    h("span", { class: "abicon" }, "🗓"),
    h("div", { style: "flex:1 1 240px" }, h("strong", {}, "Muayene yaklaşıyor"),
      h("div", { class: "small" }, due.map(c => c.plaka + (c.ad ? " (" + c.ad + ")" : "") + " · " + muayeneText(c.kalan_gun)).join(" — "))),
    A.tab !== "araclar" ? h("button", { class: "btn link", type: "button", onclick: () => { A.tab = "araclar"; adminBoot(); } }, "Araçlara git ›") : null);
}

  if (c.son_konum){

    const el = h("div", { style: "height:260px;border-radius:12px;border:1px solid var(--line);overflow:hidden" });
    body.append(el);
    try { const m = await makeMap(el, [k.lat, k.lon], 13); m.dot("k", k.lat, k.lon, "#2563eb", c.plaka, esc(k.ad) + "<br>" + esc(agoText(k.zaman))); } catch (e) { el.replaceWith(note(e.message)); }
  }
  const tripsBox = h("div", { class: "tgrid" });
  body.append(h("h3", { style: "margin:4px 0 0" }, "Son yolculukları"), tripsBox);
  try {
    const from = new Date(); from.setDate(from.getDate() - 90);
    const rows = (await rpc("y_yolculuklar", { p_token: A.token, p_bas: iso(from), p_bit: null }) || [])
      .filter(r => (r.plaka || "").replace(/\s/g, "").toUpperCase() === c.plaka.replace(/\s/g, "").toUpperCase()).slice(0, 12);
    if (!rows.length) tripsBox.replaceWith(h("p", { class: "muted small" }, "Son 90 günde bu araçla iş yolculuğu yok."));
    rows.forEach(r => tripsBox.append(tripCard(r, x => { dlg.close(); tripDialog(x); })));
  } catch (e) { tripsBox.replaceWith(note(e.message)); }
}

async function adminVehicles(){
  const carsBox = h("div", { style: "display:flex;flex-direction:column;gap:10px" });
  app.append(h("div", { class: "split" }, h("h2", {}, "Şirket araçları"),
    h("button", { class: "btn primary", type: "button", onclick: () => { carsBox.prepend(carForm(null, () => adminBoot())); } }, "+ Araç ekle")), carsBox);
  try {
    const res = await rpc("y_araclar", { p_token: A.token });
    A.cars = res.araclar || [];
    const grid = h("div", { class: "tgrid" });
    A.cars.forEach(c => {
      const mk = muayeneKind(c.kalan_gun);
      const editBox = h("div");
      grid.append(h("div", { class: "pcard" + (c.aktif ? "" : " off") },
        h("div", { style: "display:flex;align-items:center;gap:12px" }, h("span", { class: "avatar", style: "background:#0f172a" }, "🚐"),
          h("div", { style: "flex:1;min-width:0" }, h("div", { class: "ttitle" }, c.plaka), h("div", { class: "tsub" }, (c.ad || "—") + (c.aktif ? "" : " · pasif")))),
        h("div", { class: "mband " + mk }, "🗓 " + muayeneText(c.kalan_gun) + (c.muayene ? " · " + tr(c.muayene) : "")),
        h("div", { class: "tstats" },
          h("div", { class: "s1" }, h("b", {}, fmtKm(c.ay_km)), h("span", {}, "KM BU AY")),
          h("div", { class: "s2" }, h("b", {}, c.ay_yolculuk), h("span", {}, "YOLCULUK")),
          h("div", { class: "s3" }, h("b", {}, (c.suruculer || []).length), h("span", {}, "SÜRÜCÜ"))),
        h("div", { class: "tsub" }, c.son_konum ? "Son konum: " + c.son_konum.ad + " · " + agoText(c.son_konum.zaman) : "Konum bilgisi yok"),
        h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" },
          h("button", { class: "btn", type: "button", onclick: () => carDialog(c) }, "Araç sayfası"),
          h("button", { class: "btn", type: "button", onclick: () => editBox.replaceChildren(carForm(c, () => adminBoot())) }, "Düzenle")), editBox));
    });
    if (A.cars.length) carsBox.append(grid);
    else carsBox.append(note("Henüz şirket aracı eklenmedi. “+ Araç ekle” ile plakayı ve muayene tarihini gir; muayene yaklaşınca hem burada hem aracı kullanan çalışanın uygulamasında uyarı çıkar.", "info"));
    if ((res.yeni || []).length) carsBox.append(h("div", { class: "card" }, h("strong", {}, "Yolculuklarda görülen, listede olmayan plakalar"),
      h("div", { class: "chips" }, res.yeni.map(p => h("button", { type: "button", class: "chip", onclick: async () => {
        try { await rpc("y_arac_kaydet", { p_token: A.token, p_id: null, p_plaka: p, p_ad: "", p_muayene: null, p_aktif: true }); adminBoot(); } catch (e) { alert(e.message); }
      } }, "+ " + p)))));
  } catch (e) {
    carsBox.append(note(/y_araclar|function|fonksiyon/i.test(e.message) ? "Araç listesi için Supabase güncellemesi (guncelleme-arac.sql) henüz çalıştırılmamış." : e.message));
  }

  const head = h("div", { class: "split", style: "margin-top:10px" }, h("h2", {}, "Canlı konumlar"), h("span", { class: "muted small", id: "v-upd" }, ""));
  const mapEl = h("div", { id: "vmap", style: "height:58vh;min-height:320px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#e8ecef" });
  const list = h("div", { class: "tgrid" });
  app.append(head, h("p", { class: "muted small", style: "margin:0" }, "Şirket aracıyla “İş” yolculuğu yapan çalışanların konumu. Yolculuk sürerken canlı görünür; bitince son iş konumu ve saati kalır. Şahsi araç ve şahsi yolculuklardan hiçbir bilgi gelmez. 30 sn'de bir yenilenir."), mapEl, list);
  let map = null;
  try { map = await makeMap(mapEl); } catch (e) { mapEl.replaceWith(note(e.message)); }
  $("#v-upd") && ($("#v-upd").dataset.lib = map ? (map.lib === "google" ? "Google haritası" : "OpenStreetMap") : "");
  let fitted = false;
  async function load(){
    try {
      const rows = await rpc("y_konumlar", { p_token: A.token }) || [];
      $("#v-upd") && ($("#v-upd").textContent = ($("#v-upd").dataset.lib ? $("#v-upd").dataset.lib + " · " : "") + "Güncellendi " + new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
      list.textContent = "";
      const pts = [];
      for (const v of rows){
        const st = vehState(v);
        const detail = [
          v.plaka || v.arac ? [v.plaka, v.arac].filter(Boolean).join(" · ") : null,
          v.koridor ? "EDS: " + v.koridor + (v.ortalama != null ? " · ort. " + v.ortalama + (v.limit ? " / " + v.limit : "") + " km/s" : "") : null,
          v.hedef ? "Hedef: " + v.hedef : null,
          v.km != null && Number(v.km) > 0 ? "Bu sürüş " + fmtKm(Number(v.km)) + " km" : null
        ].filter(Boolean);
        let mk = null;
        if (v.lat != null && map){
          pts.push([v.lat, v.lon]);
          mk = map.dot("v" + v.calisan_id, v.lat, v.lon, st.c, v.ad, "<b>" + esc(v.ad) + "</b><br>" + esc(st.t) + "<br>" + detail.map(esc).join("<br>"));
        }
        const card = h("div", { class: "pcard", style: "cursor:" + (v.lat != null ? "pointer" : "default") },
          h("div", { style: "display:flex;align-items:center;gap:12px" }, h("span", { class: "avatar", style: "background:" + personColor(v.ad) }, initials(v.ad)),
            h("div", { style: "flex:1;min-width:0" }, h("div", { class: "ttitle" }, v.ad), h("span", { class: "pill", style: "background:" + st.c + ";color:#fff;display:inline-block;margin-top:4px" }, st.t))),
          detail.length ? h("div", { class: "tsub" }, detail.join(" · ")) : null);
        if (mk) card.addEventListener("click", () => { map.center(v.lat, v.lon); mk.open(); mapEl.scrollIntoView({ behavior: "smooth" }); });
        list.append(card);
      }
      if (map && pts.length && !fitted){ fitted = true; map.fit(pts); }
      if (!rows.some(v => v.lat != null)) list.prepend(note("Henüz konum paylaşan yok.", "info"));
    } catch (e) { list.replaceChildren(note(e.message)); }
  }
  await load();
  A.mapTimer = setInterval(() => { if (A.tab === "araclar" && document.body.contains(list)) load(); else { clearInterval(A.mapTimer); A.mapTimer = null; } }, 30000);
}

async function adminPeople(){
  const list = h("div", { style: "display:flex;flex-direction:column;gap:10px" });
  app.append(h("h2", {}, "Çalışanlar"), h("p", { class: "muted small" }, "Günlük ücret yalnızca burada ve Hesap sayfasında görünür. Şifre kutusunu boş bırakırsan mevcut şifre değişmez."), list);
  function row(p){
    const ad = h("input", { value: p ? p.ad : "", placeholder: "Ad Soyad" });
    const ucret = h("input", { type: "number", inputmode: "decimal", step: "0.01", value: p ? p.gunluk_ucret : "", placeholder: "Günlük ücret (TL)" });
    const pin = h("input", { type: "text", inputmode: "numeric", placeholder: p ? "Yeni şifre (boş = değişmez)" : "Şifre (boş = 2945)" });
    const aktif = h("input", { type: "checkbox", checked: p ? p.aktif : true, style: "width:auto" });
    const out = h("div");
    const save = h("button", { class: "btn primary", onclick: async () => {
      try {
        await rpc("y_calisan_kaydet", { p_token: A.token, p_id: p ? p.id : null, p_ad: ad.value, p_gunluk: ucret.value === "" ? null : Number(ucret.value), p_aktif: aktif.checked, p_pin: pin.value || null });
        out.replaceChildren(note("Kaydedildi.", "ok")); pin.value = "";
        if (!p) adminBoot();
      } catch (e) { out.replaceChildren(note(e.message)); }
    } }, p ? "Kaydet" : "Çalışan ekle");
    const prof = p ? h("span", { style: "display:flex;gap:6px;flex-wrap:wrap" },
      h("button", { class: "btn", type: "button", onclick: () => { A.ledgerOf = { id: p.id, ad: p.ad, ucret: p.gunluk_ucret }; A.tab = "hesap"; adminBoot(); } }, "Hesap dökümü"),
      h("button", { class: "btn", type: "button", onclick: () => { A.leaveOf = { id: p.id, ad: p.ad }; A.tab = "izinler"; adminBoot(); } }, "Pazar izinleri")) : null;
    return h("div", { class: "card" }, prof ? h("div", { class: "split" }, h("strong", {}, p.ad), prof) : null,
      h("div", { class: "row" }, h("label", {}, "Ad", ad), h("label", {}, "Günlük ücret (TL)", ucret)),
      h("div", { class: "row" }, h("label", {}, "Şifre", pin), h("label", { style: "flex-direction:row;align-items:center;gap:8px;color:var(--fg)" }, aktif, "Aktif (giriş yapabilir)")), out, save);
  }
  A.people.forEach(p => list.append(row(p)));
  list.append(h("h2", {}, "Yeni çalışan"), row(null));
}

/* ---------- başlat ---------- */
if (!window.SB_URL || !window.SB_KEY){
  app.append(h("div", { class: "card login" }, h("h2", {}, "Kurulum bekleniyor"),
    h("p", { class: "muted" }, "Sunucu bağlantı bilgileri (config.js) henüz girilmedi.")));
} else if (ADMIN) {
  adminBoot();
} else {
  staffBoot();
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
